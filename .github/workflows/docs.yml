# Builds the documentation site with Moonwave (the API reference from the doc comments of src/,
# the pages of docs/, README.md as the home page) and publishes it to GitHub Pages
# (Settings → Pages → Source: GitHub Actions). See docs/development/README.md.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "README.md"
      - "moonwave.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: README links for the site
        # docs/x/README.md on GitHub is docs/x on the site, docs/x/y.md is docs/x/y (README.md
        # becomes the home page)
        run: |
          sed -i -E -e 's#\]\(docs/([a-z-]+)/README\.md(\#[a-z0-9-]+)?\)#](docs/\1\2)#g' \
            -e 's#\]\(docs/([a-z-]+)/([a-z-]+)\.md(\#[a-z0-9-]+)?\)#](docs/\1/\2\3)#g' README.md
      - run: npx --yes moonwave@1.4.2 build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
